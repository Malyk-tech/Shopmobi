<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#103d2d">
  <title>Shopmobi — Shopping Made Easy</title>
  <style>
    :root{color-scheme:dark;--green:#103d2d;--mint:#cde8d5;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 30%,#246447 0,#103d2d 48%,#09271d 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--white)}
    main{width:min(100%,440px);text-align:center;padding:42px 28px;border:1px solid #ffffff24;border-radius:28px;background:#ffffff0d;box-shadow:0 24px 80px #0003;backdrop-filter:blur(12px)}
    .mark{width:76px;height:76px;margin:0 auto 22px;border-radius:23px;background:#fff;display:grid;place-items:center;color:var(--green);font-size:38px;font-weight:900;box-shadow:0 8px 28px #0002}
    h1{margin:0;font-size:clamp(30px,8vw,40px);letter-spacing:2px;font-weight:850}
    .tagline{margin:8px 0 34px;color:var(--mint);font-size:15px;letter-spacing:.3px}
    .spinner{width:42px;height:42px;margin:0 auto 20px;border:4px solid #ffffff35;border-top-color:#fff;border-radius:50%;animation:spin .85s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .status{font-size:15px;color:#fff;margin:0 0 9px}
    .hint{font-size:12px;line-height:1.6;color:#cde8d5;margin:0}
    .retry{display:none;margin:22px auto 0;padding:11px 20px;border:0;border-radius:999px;background:#fff;color:var(--green);font-weight:700;cursor:pointer}
    @media(prefers-reduced-motion:reduce){.spinner{animation:none}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">S</div>
    <h1>SHOPMOBI</h1>
    <p class="tagline">Shopping Made Easy.</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="status" id="status" aria-live="polite">Getting your shopping experience ready…</p>
    <p class="hint">Please wait while we connect you to the marketplace.</p>
    <button class="retry" id="retry" type="button">Try again</button>
  </main>
  <script>
    const SHOP_URL = 'https://shopmobi-ei0e.onrender.com';
    const statusText = document.getElementById('status');
    const retryButton = document.getElementById('retry');
    let checking = false;
    async function checkShop() {
      if (checking) return;
      checking = true;
      retryButton.style.display = 'none';
      statusText.textContent = 'Connecting to Shopmobi…';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch(SHOP_URL + '/health?check=' + Date.now(), {
          method: 'GET', mode: 'cors', cache: 'no-store',
          credentials: 'omit', signal: controller.signal
        });
        if (response.ok && (await response.text()).trim() === 'ok') {
          statusText.textContent = 'Shopmobi is ready. Opening the marketplace…';
          window.location.replace(SHOP_URL);
          return;
        }
        throw new Error('Shopmobi is still starting');
      } catch (error) {
        statusText.textContent = 'Shopmobi is waking up. We’ll keep trying…';
      } finally {
        clearTimeout(timeout);
        checking = false;
      }
      setTimeout(checkShop, 5000);
    }
    retryButton.addEventListener('click', checkShop);
    checkShop();
  </script>
</body>
</html>
